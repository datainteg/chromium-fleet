<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="40" y1="40" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="0.55" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="ringGradient" x1="20" y1="20" x2="340" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
